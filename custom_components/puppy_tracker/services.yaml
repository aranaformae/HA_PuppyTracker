create_litter:
  name: Nest aanmaken
  description: Maak een nieuw nest aan.
  fields:
    name:
      name: Naam
      description: Naam van het nest.
      required: true
      example: "Luna 2026"
      selector:
        text:

    birth_date:
      name: Geboortedatum
      description: Geboortedatum van het nest.
      required: false
      selector:
        date:

    mother:
      name: Roepnaam moeder
      description: Roepnaam van de moederhond.
      required: false
      selector:
        text:

    mother_registered_name:
      name: Naam moeder
      description: Officiële of geregistreerde naam van de moederhond.
      required: false
      selector:
        text:

    mother_birth_date:
      name: Geboortedatum moeder
      description: Geboortedatum van de moederhond.
      required: false
      selector:
        date:

    mother_breed:
      name: Soort moeder
      description: Ras of soort van de moederhond.
      required: false
      default: Multi-generation Australian Labradoodle
      selector:
        text:

    mother_wala_number:
      name: WALA moeder
      description: WALA-registratienummer van de moederhond.
      required: false
      selector:
        text:

    mother_chip_number:
      name: Chipnummer moeder
      description: Chipnummer van de moederhond; voorloopnullen blijven behouden.
      required: false
      selector:
        text:

    father:
      name: Roepnaam vader
      description: Roepnaam van de vaderhond.
      required: false
      selector:
        text:

    father_registered_name:
      name: Naam vader
      description: Officiële of geregistreerde naam van de vaderhond.
      required: false
      selector:
        text:

    father_birth_date:
      name: Geboortedatum vader
      description: Geboortedatum van de vaderhond.
      required: false
      selector:
        date:

    father_breed:
      name: Soort vader
      description: Ras of soort van de vaderhond.
      required: false
      default: Multi-generation Australian Labradoodle
      selector:
        text:

    father_wala_number:
      name: WALA vader
      description: WALA-registratienummer van de vaderhond.
      required: false
      selector:
        text:

    father_chip_number:
      name: Chipnummer vader
      description: Chipnummer van de vaderhond; voorloopnullen blijven behouden.
      required: false
      selector:
        text:


add_puppy:
  name: Puppy toevoegen
  description: Voeg een puppy toe aan een bestaand nest.
  fields:
    litter_id:
      name: Nest ID
      description: Unieke ID van het nest.
      required: true
      selector:
        text:

    name:
      name: Roepnaam
      description: Roepnaam of herkenningsnaam van de pup.
      required: true
      example: "Rood"
      selector:
        text:

    registered_name:
      name: Nestnaam
      description: Officiële of geregistreerde naam van de pup.
      required: false
      selector:
        text:

    collar_color:
      name: Halsbandkleur
      description: Herkenningskleur van de pup.
      required: false
      selector:
        text:

    coat_color:
      name: Vachtkleur
      description: Vachtkleur van de pup, los van de halsbandkleur.
      required: false
      selector:
        text:

    breed:
      name: Soort
      description: Ras of soort van de pup.
      required: false
      default: Multi-generation Australian Labradoodle
      selector:
        text:

    sex:
      name: Geslacht
      description: Geslacht van de pup.
      required: false
      selector:
        select:
          options:
            - label: Reu
              value: male
            - label: Teef
              value: female

    birth_weight:
      name: Geboortegewicht
      description: Geboortegewicht in gram.
      required: false
      selector:
        number:
          min: 1
          max: 5000
          step: 1
          unit_of_measurement: g
          mode: box

    birth_time:
      name: Geboortetijd
      description: Datum en tijd waarop de pup geboren is.
      required: false
      selector:
        datetime:

    profile_note:
      name: Profielnotitie
      description: Blijvende samenvatting of bijzonderheden over de pup.
      required: false
      selector:
        text:
          multiline: true

    chip_number:
      name: Chipnummer
      description: Optioneel chipnummer van de pup. Wordt als tekst bewaard zodat voorloopnullen behouden blijven.
      required: false
      selector:
        text:


record_weight:
  name: Gewicht registreren
  description: Registreer een nieuwe gewichtsmeting voor een puppy.
  fields:
    litter_id:
      name: Nest ID
      description: Unieke ID van het nest.
      required: true
      selector:
        text:

    puppy_id:
      name: Puppy ID
      description: Unieke ID van de puppy.
      required: true
      selector:
        text:

    weight:
      name: Gewicht
      description: Gewicht van de puppy in gram.
      required: true
      example: 428
      selector:
        number:
          min: 1
          max: 10000
          step: 1
          unit_of_measurement: g
          mode: box

    timestamp:
      name: Tijdstip
      description: Tijdstip van de meting. Leeg laten gebruikt de huidige tijd.
      required: false
      selector:
        datetime:

    note:
      name: Notitie
      description: Optionele notitie bij de meting.
      required: false
      selector:
        text:
          multiline: true


backup_to_file:
  name: Backup naar bestand
  description: Schrijf een importeerbare Puppy Tracker JSON-backup in de Home Assistant configuratiemap.
  fields:
    path:
      name: Bestandspad
      description: Relatief pad binnen de Home Assistant configuratiemap, bijvoorbeeld backups/puppy-tracker.json.
      required: true
      example: backups/puppy-tracker.json
      selector:
        text:

    scope:
      name: Backupbereik
      description: Maak een volledige backup, van één nest of van één pup.
      required: false
      default: full
      selector:
        select:
          options:
            - label: Volledige backup
              value: full
            - label: Eén nest
              value: litter
            - label: Eén pup
              value: puppy

    litter_id:
      name: Nest ID
      description: Vereist voor een nest- of pup-backup.
      required: false
      selector:
        text:

    puppy_id:
      name: Puppy ID
      description: Vereist voor een pup-backup.
      required: false
      selector:
        text:

    include_timestamp:
      name: Datum en tijd toevoegen
      description: Voeg een UTC-datum en tijd aan de bestandsnaam toe zodat meerdere versies behouden blijven.
      required: false
      default: false
      selector:
        boolean:

    keep_last:
      name: Aantal versies bewaren
      description: Verwijder oudere versies met dezelfde bestandsnaam. Leeg laten bewaart alle versies.
      required: false
      selector:
        number:
          min: 1
          max: 3650
          step: 1
          mode: box

add_dossier_record:
  name: Dossieritem toevoegen
  description: Maak één dossieritem voor het nest, de moederhond of een pup. Geeft desgevraagd de nieuwe record-ID terug.
  fields:
    litter_id:
      name: Nest-ID
      description: ID van het nest waaraan het item behoort.
      required: true
      selector:
        text:
    scope:
      name: Eigenaar
      description: Kies expliciet of het item bij het hele nest, de moederhond of een pup hoort.
      required: true
      selector:
        select:
          options:
            - label: Hele nest
              value: litter
            - label: Moederhond
              value: mother
            - label: Pup
              value: puppy
    puppy_id:
      name: Pup-ID
      description: Verplicht wanneer Eigenaar op Pup staat; anders leeg laten.
      required: false
      selector:
        text:
    record_type:
      name: Categorie
      description: Dossiercategorie, bijvoorbeeld note, feeding, daily_care of medication.
      required: true
      selector:
        text:
    occurred_at:
      name: Tijdstip
      description: Datum en tijd van de gebeurtenis; leeg gebruikt het huidige tijdstip.
      required: false
      selector:
        datetime:
    title:
      name: Titel
      required: false
      selector:
        text:
    note:
      name: Notitie
      required: false
      selector:
        text:
          multiline: true
    data:
      name: Gestructureerde gegevens
      description: "Optionele velden als object, bijvoorbeeld {feeding_category: bottle, amount: 30, unit: ml}."
      required: false
      selector:
        object: {}
    followup_record_id:
      name: Bronitem-ID voor opvolging
      description: Alleen invullen bij het uitvoeren van een bestaande dossieropvolging.
      required: false
      selector:
        text:
    followup_due_date:
      name: Vervolgdatum van het bronitem
      description: Gebruik samen met Bronitem-ID om de juiste geplande opvolging af te handelen.
      required: false
      selector:
        date:

update_dossier_record:
  name: Dossieritem wijzigen
  description: Wijzig opgegeven velden van een bestaand dossieritem zonder de overige gegevens te wissen.
  fields:
    litter_id:
      name: Nest-ID
      required: true
      selector:
        text:
    scope:
      name: Eigenaar
      required: true
      selector:
        select:
          options:
            - label: Hele nest
              value: litter
            - label: Moederhond
              value: mother
            - label: Pup
              value: puppy
    puppy_id:
      name: Pup-ID
      description: Alleen invullen als Eigenaar op Pup staat.
      required: false
      selector:
        text:
    record_id:
      name: Dossieritem-ID
      required: true
      selector:
        text:
    record_type:
      name: Categorie
      required: false
      selector:
        text:
    occurred_at:
      name: Tijdstip
      required: false
      selector:
        datetime:
    title:
      name: Titel
      required: false
      selector:
        text:
    note:
      name: Notitie
      required: false
      selector:
        text:
          multiline: true
    data:
      name: Gestructureerde gegevens
      description: Opgegeven sleutels worden samengevoegd met bestaande gegevens.
      required: false
      selector:
        object: {}

delete_dossier_record:
  name: Dossieritem verwijderen
  description: Verberg een dossieritem; het kan later met de herstelactie worden teruggezet.
  fields:
    litter_id:
      name: Nest-ID
      required: true
      selector:
        text:
    scope:
      name: Eigenaar
      required: true
      selector:
        select:
          options:
            - label: Hele nest
              value: litter
            - label: Moederhond
              value: mother
            - label: Pup
              value: puppy
    puppy_id:
      name: Pup-ID
      description: Alleen invullen als Eigenaar op Pup staat.
      required: false
      selector:
        text:
    record_id:
      name: Dossieritem-ID
      required: true
      selector:
        text:

restore_dossier_record:
  name: Dossieritem herstellen
  description: Zet een eerder verwijderd dossieritem terug.
  fields:
    litter_id:
      name: Nest-ID
      required: true
      selector:
        text:
    scope:
      name: Eigenaar
      required: true
      selector:
        select:
          options:
            - label: Hele nest
              value: litter
            - label: Moederhond
              value: mother
            - label: Pup
              value: puppy
    puppy_id:
      name: Pup-ID
      description: Alleen invullen als Eigenaar op Pup staat.
      required: false
      selector:
        text:
    record_id:
      name: Dossieritem-ID
      required: true
      selector:
        text:
