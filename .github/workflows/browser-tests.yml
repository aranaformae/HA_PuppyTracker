name: Browser tests

on:
  workflow_call:
    inputs:
      playwright_version:
        description: Must match the exact @playwright/test version in package-lock.json
        type: string
        default: "1.64.1"

permissions:
  contents: read

jobs:
  browser-tests:
    name: Chromium and WebKit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v${{ inputs.playwright_version }}-noble
      options: --ipc=host

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python for the fixture server
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked frontend test dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify matching preinstalled browsers
        env:
          PLAYWRIGHT_IMAGE_VERSION: ${{ inputs.playwright_version }}
        run: |
          node <<'JS'
          const fs = require("node:fs");
          const version = require("@playwright/test/package.json").version;
          if (version !== process.env.PLAYWRIGHT_IMAGE_VERSION) {
            throw new Error(`Playwright package ${version} does not match image ${process.env.PLAYWRIGHT_IMAGE_VERSION}. Update the shared browser workflow when updating Playwright.`);
          }
          const { chromium, webkit } = require("playwright");
          for (const browser of [chromium, webkit]) {
            fs.accessSync(browser.executablePath(), fs.constants.X_OK);
            console.log(`Ready: ${browser.name()}`);
          }
          JS

      - name: Run Playwright card tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
