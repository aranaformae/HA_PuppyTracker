name: Create GitHub Release
run-name: Release ${{ github.event.workflow_run.head_sha || inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"
  workflow_run:
    workflows: ["Puppy Tracker CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish after its CI succeeds
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || github.event.after || inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish after CI
    if: >-
      (github.event_name != 'push' || !github.event.deleted) &&
      (github.event_name != 'workflow_run' ||
       ((github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # workflow_run can carry privileged credentials: execute only the trusted
      # default-branch gate, never scripts/artifacts from the completed run.
      - name: Checkout release gate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reuse matching CI and publish
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const { publishRelease } = require('./scripts/release-gate.cjs');
            await publishRelease({ github, context, core, manualTag: process.env.RELEASE_TAG });
