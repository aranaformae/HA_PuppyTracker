name: Create GitHub Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  validate-and-release:
    name: Validate version and create release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read manifest version
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="custom_components/puppy_tracker/manifest.json"

          if [ ! -f "$MANIFEST" ]; then
            echo "❌ manifest.json not found:"
            echo "$MANIFEST"
            exit 1
          fi

          VERSION=$(jq -er '.version' "$MANIFEST")

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "❌ No version found in manifest.json"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Manifest version found: $VERSION"

      - name: Validate Puppy Tracker metadata
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="custom_components/puppy_tracker/manifest.json"
          CONST_FILE="custom_components/puppy_tracker/const.py"
          HACS_FILE="hacs.json"
          EXPECTED_DOMAIN="puppy_tracker"
          EXPECTED_NAME="Puppy Tracker"
          VERSION="${{ steps.manifest.outputs.version }}"

          DOMAIN=$(jq -er '.domain' "$MANIFEST")
          NAME=$(jq -er '.name' "$MANIFEST")

          if [ "$DOMAIN" != "$EXPECTED_DOMAIN" ]; then
            echo "❌ Manifest domain mismatch: $DOMAIN (expected $EXPECTED_DOMAIN)"
            exit 1
          fi

          if [ "$NAME" != "$EXPECTED_NAME" ]; then
            echo "❌ Manifest name mismatch: $NAME (expected $EXPECTED_NAME)"
            exit 1
          fi

          if [ ! -f "$HACS_FILE" ]; then
            echo "❌ hacs.json not found"
            exit 1
          fi

          HACS_NAME=$(jq -er '.name' "$HACS_FILE")
          if [ "$HACS_NAME" != "$EXPECTED_NAME" ]; then
            echo "❌ HACS name mismatch: $HACS_NAME (expected $EXPECTED_NAME)"
            exit 1
          fi

          if [ ! -f "$CONST_FILE" ]; then
            echo "❌ const.py not found: $CONST_FILE"
            exit 1
          fi

          CONST_VERSION=$(sed -n 's/^VERSION = "\([^"]*\)"$/\1/p' "$CONST_FILE")
          if [ -z "$CONST_VERSION" ]; then
            echo "❌ Could not read VERSION from const.py"
            exit 1
          fi

          if [ "$CONST_VERSION" != "$VERSION" ]; then
            echo "❌ Version mismatch between manifest.json and const.py"
            echo "Manifest: $VERSION"
            echo "const.py: $CONST_VERSION"
            exit 1
          fi

          echo "✅ Puppy Tracker metadata is consistent."

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.manifest.outputs.version }}"

          # Accept the manifest version with no prefix, v, or V.
          NORMALIZED_TAG="${TAG#[vV]}"

          echo "Git tag:          $TAG"
          echo "Normalized tag:   $NORMALIZED_TAG"
          echo "Manifest version: $VERSION"

          if [ "$NORMALIZED_TAG" != "$VERSION" ]; then
            echo ""
            echo "❌ Version mismatch!"
            echo "Tag:        $TAG"
            echo "Normalized: $NORMALIZED_TAG"
            echo "Manifest:   $VERSION"
            echo ""
            echo "The Git tag must match the version in:"
            echo "custom_components/puppy_tracker/manifest.json"
            echo ""
            echo "Accepted examples for version $VERSION:"
            echo "  $VERSION"
            echo "  v$VERSION"
            echo "  V$VERSION"
            exit 1
          fi

          echo ""
          echo "✅ Tag matches manifest version."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true