name: Create GitHub Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  validate-and-release:
    name: Validate version and create release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read manifest version
        id: manifest
        shell: bash
        run: |
          VERSION=$(jq -r '.version' custom_components/puppy_weight_tracker/manifest.json)

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "❌ No version found in manifest.json"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $VERSION"

      - name: Validate tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.manifest.outputs.version }}"

          echo "Git tag:          $TAG"
          echo "Manifest version: $VERSION"

          if [ "$TAG" != "$VERSION" ]; then
            echo ""
            echo "❌ Version mismatch!"
            echo "Tag:      $TAG"
            echo "Manifest: $VERSION"
            echo ""
            echo "Update manifest.json or use the correct tag."
            exit 1
          fi

          echo "✅ Tag matches manifest version."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true