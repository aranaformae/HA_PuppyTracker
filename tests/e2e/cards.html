<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puppy Tracker E2E fixture</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, sans-serif;
      }

      #cards {
        display: grid;
        gap: 16px;
        padding: 16px;
      }

      /* In Home Assistant ha-card is a rendered block component. In this
         lightweight fixture it is otherwise an undefined inline custom tag,
         which gives WebKit incorrect hit-testing for overflowing controls. */
      ha-card {
        display: block;
      }
    </style>
  </head>
  <body>
    <main id="cards"></main>
    <script type="module">
      const frontendBase = "/custom_components/puppy_tracker/frontend";
      const modules = [
        "puppy-tracker-card.js",
        "puppy-tracker-overview-card.js",
        "puppy-tracker-summary-card.js",
        "puppy-tracker-today-card.js",
        "puppy-tracker-attention-card.js",
        "puppy-tracker-recurring-reminder-card.js",
        "puppy-tracker-care-program-card.js",
        "puppy-tracker-care-execution-card.js",
        "puppy-tracker-litter-card.js",
        "puppy-tracker-report-card.js",
        "puppy-tracker-owner-card.js",
        "puppy-tracker-dossier-card.js",
        "puppy-tracker-quick-log-card.js",
        "puppy-tracker-bulk-dossier-card.js",
        "puppy-tracker-timeline-card.js",
        "puppy-tracker-temperature-card.js",
        "puppy-tracker-workspace-card.js",
      ];

      window.__puppyTrackerModuleErrors = [];

      // Focused legacy tests mount base surfaces; production regressions exercise
      // every extension in the same order as Home Assistant's CARD_FILES.
      const production = new URLSearchParams(location.search).has("production");
      const extensions = new Set([
        "puppy-tracker-recurring-reminder-card.js",
        "puppy-tracker-care-program-card.js",
        "puppy-tracker-owner-card.js",
      ]);

      for (const filename of modules) {
        if (!production && extensions.has(filename)) continue;
        try {
          await import(`${frontendBase}/${filename}`);
        } catch (error) {
          window.__puppyTrackerModuleErrors.push({
            filename,
            message: error?.stack || error?.message || String(error),
          });
        }
      }

      window.__puppyTrackerReady = true;
    </script>
  </body>
</html>
